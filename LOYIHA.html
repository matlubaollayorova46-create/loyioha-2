<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gul Bo‘yash</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#dfffe0;
        font-family:Arial;
        gap:40px;
    }

    .flower{
        position:relative;
        width:200px;
        height:200px;
    }

    .petal{
        width:80px;
        height:80px;
        background:pink;
        border-radius:50%;
        position:absolute;
        cursor:pointer;
        transition:0.3s;
    }

    .petal:hover{
        transform:scale(1.08);
    }

    .p1{ top:0; left:60px; }
    .p2{ top:60px; left:0; }
    .p3{ top:60px; right:0; }
    .p4{ bottom:0; left:60px; }

    .center{
        width:70px;
        height:70px;
        background:yellow;
        border-radius:50%;
        position:absolute;
        top:65px;
        left:65px;
        cursor:pointer;
    }

    .stem{
        width:12px;
        height:170px;
        background:green;
        position:absolute;
        top:180px;
        left:94px;
        border-radius:10px;
    }

    .controls{
        background:white;
        padding:20px;
        border-radius:15px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    button{
        width:45px;
        height:45px;
        border:none;
        margin:5px;
        border-radius:50%;
        cursor:pointer;
    }

    h2{
        margin-top:0;
    }
</style>
</head>

<body>

<div class="flower">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>

    <div class="center"></div>
    <div class="stem"></div>
</div>

<div class="controls">
    <h2>Rang tanlang</h2>

    <button style="background:red" onclick="setColor('red')"></button>
    <button style="background:blue" onclick="setColor('blue')"></button>
    <button style="background:yellow" onclick="setColor('yellow')"></button>
    <button style="background:pink" onclick="setColor('pink')"></button>
    <button style="background:purple" onclick="setColor('purple')"></button>
    <button style="background:orange" onclick="setColor('orange')"></button>
    <button style="background:green" onclick="setColor('green')"></button>
</div>

<script>
let selectedColor = "red";

function setColor(color){
    selectedColor = color;
}

const parts = document.querySelectorAll('.petal, .center');

parts.forEach(part => {
    part.addEventListener('click', () => {
        part.style.background = selectedColor;
    });
});
</script>

</body>
</html>
